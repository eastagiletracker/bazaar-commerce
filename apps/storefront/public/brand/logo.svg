<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 148 36" role="img" aria-label="Bazaar">
  <!--
    Wordmark, hand-drawn as SVG rather than generated: a logo has to stay crisp
    at 20px in a mobile header and weigh almost nothing. This is ~1KB.

    The mark is a shopping bag whose handle doubles as a check — the trust
    promise compressed into the smallest possible space.
  -->
